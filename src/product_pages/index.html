<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Details</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="product-detail">
        <h3>Cedar Ridge</h3>

        <h2 class="divider">Rimrock Tent - 2-Person, 3-Season</h2>

        <img
          id="productImage"
          class="divider"
          src="../images/tents/cedar-ridge-rimrock-tent-2-person-3-season-in-rust-clay~p~344yj_01~320.jpg"
          alt="Rimrock Tent - 2-Person, 3-Season"
        />

        <p id="productPrice" class="product-card__price">$69.99</p>
        
        <div id="discountFlag" class="discount-flag"></div>
        
        <p id="productColor" class="product__color">Rust/Clay</p>
        
        <p id="productDesc" class="product__description">
          Lightweight and ready for adventure, this Cedar Ridge Rimrock tent
          boasts a weather-ready design that includes a tub-style floor and
          factory-sealed rain fly
        </p>

        <div class="product-detail__add">
          <button id="addToCart" data-id="344YJ">Add to Cart</button>
        </div>
        <h2>Product Details</h2>
        <figure>
          <img src="" alt="" id="p-image" width="300" />
        </figure>
        <section id="product-info">
          <h3 id="p-brand"></h3>
          <p id="p-name"></p>
          <p id="p-color"></p>
          <p id="p-description"></p>
          <p id="p-price"></p>
          <button id="add-to-cart" data-id="">Add to Cart</button>
        </section>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
