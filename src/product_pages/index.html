    <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Details</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/product.js" type="module"></script>
  </head>

  <body>
   <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="product-detail">
        
        <h2 >Product Details</h2>
        <img id="productImage" src="" alt="" />

        <h3 id="p-brand"></h3>
        <h3 id="p-name" class="title-clean"></h3>

        <p id="productColor" class="product__color"></p>

        <p id="productPrice" class="product-card__price"></p>
        
        <div id="discountFlag" class="discount-flag"></div>
        <div id="productDesc" class="product__description"></div>


        <div class="product-detail__add">
          <button id="addToCart" data-id="">Add to Cart</button>
        </div>

      </section>
    </main>
  
    <footer id="main-footer"></footer>
  </body>
</html>
